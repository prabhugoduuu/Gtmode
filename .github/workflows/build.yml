name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p src
          for z in *.zip; do unzip -o "$z" -d src; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build debug APK
        working-directory: src/PrabhuGameBooster
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PrabhuGameBooster-GT-FreeFireIndia
          path: src/PrabhuGameBooster/app/build/outputs/apk/debug/app-debug.apk
